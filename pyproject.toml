[project]
name = "ha-tokyu-bus"
version = "0.2.0"
description = "Unofficial Tokyu Bus integration for Home Assistant"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["aiohttp>=3.12", "jpholiday==1.0.3", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
